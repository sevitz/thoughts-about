# Checks posts on every pull request and on pushes to main.
# The checks themselves live in a private repo and are fetched with a read-only deploy key.
# The job id `validate` is the required status check on main.
name: Check posts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout posts
        uses: actions/checkout@v4
        with:
          path: content
          fetch-depth: 0

      - name: Checkout checks
        uses: actions/checkout@v4
        with:
          repository: sevitz/thoughts-about-playbooks
          ssh-key: ${{ secrets.PLAYBOOKS_DEPLOY_KEY }}
          path: playbooks

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: playbooks
        run: npm ci

      - name: Check posts
        working-directory: playbooks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run validate -- --root ../content --base "origin/${{ github.base_ref }}" --no-drafts
          else
            npm run validate -- --root ../content --base HEAD~1 --no-drafts
          fi

      - name: Check links
        if: hashFiles('content/posts/*/index.md') != ''
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config playbooks/lychee.toml --no-progress './content/posts/**/*.md'
          fail: true
